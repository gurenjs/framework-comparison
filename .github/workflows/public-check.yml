name: public-check

# Fails a pull request (or a push to main) whose files or commit messages carry
# local paths, Claude Code session data, credentials or personal addresses.
# The same check runs locally from .githooks/pre-push.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan files and commit messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="" ;; esac
          bash scripts/check-public.sh ${RANGE:+"$RANGE"}
